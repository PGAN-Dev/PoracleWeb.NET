<section class="status-strip" [attr.aria-label]="'ADMIN.STATUS_STRIP.LABEL' | translate">
  <div class="status-line">
    <p class="status-parts" data-test="status-line">
      @for (part of parts(); track part.id; let last = $last) {
        <span
          class="status-part"
          [class.tone-warn]="part.tone === 'warn'"
          [class.tone-error]="part.tone === 'error'"
          [attr.data-test]="'part-' + part.id">
          @if (part.tone !== 'plain') {
            <mat-icon class="status-icon" aria-hidden="true">{{ part.tone === 'error' ? 'error' : 'warning' }}</mat-icon>
          }
          {{ part.text }}
        </span>
        @if (!last) {
          <span class="status-sep" aria-hidden="true">·</span>
        }
      }
    </p>
    <button
      mat-button
      type="button"
      class="status-toggle"
      data-test="status-details-toggle"
      aria-controls="settings-status-details"
      [attr.aria-expanded]="detailsOpen()"
      (click)="toggleDetails()">
      {{ (detailsOpen() ? 'ADMIN.STATUS_STRIP.HIDE_DETAILS' : 'ADMIN.STATUS_STRIP.DETAILS') | translate }}
      <mat-icon iconPositionEnd>{{ detailsOpen() ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>
  </div>

  <span class="visually-hidden" role="status" data-test="status-live">{{ liveText() }}</span>

  <!-- Mounted while hidden: the line above reads both cards, and a running scan keeps reporting. -->
  <div id="settings-status-details" class="status-details" data-test="status-details" [hidden]="!detailsOpen()">
    <app-server-profile-card />
    <app-rule-repair-card />
  </div>
</section>
