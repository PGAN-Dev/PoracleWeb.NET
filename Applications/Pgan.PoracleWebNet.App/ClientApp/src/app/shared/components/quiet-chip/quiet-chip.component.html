@if (readOnly()) {
  <!-- Impersonating: the server refuses quiet writes, so a quiet subject shows its countdown and nothing more. -->
  @if (isQuiet()) {
    <span
      class="quiet-chip quiet-chip-on quiet-chip-readonly"
      [class.quiet-chip-trailing]="appearance() === 'trailing'"
      [matTooltip]="tooltip()"
      (click)="$event.stopPropagation()">
      <mat-icon class="quiet-chip-icon">notifications_paused</mat-icon>
      <span class="quiet-chip-label">{{ label() }}</span>
    </span>
  }
} @else if (appearance() === 'icon' && !isQuiet()) {
  <button mat-icon-button [matTooltip]="tooltip()" [attr.aria-label]="tooltip()" (click)="open($event)">
    <mat-icon>notifications_paused</mat-icon>
  </button>
} @else {
  <button
    type="button"
    class="quiet-chip"
    [class.quiet-chip-on]="isQuiet()"
    [class.quiet-chip-trailing]="appearance() === 'trailing'"
    [matTooltip]="tooltip()"
    [attr.aria-label]="appearance() === 'trailing' && !isQuiet() ? tooltip() : null"
    (click)="open($event)">
    <mat-icon class="quiet-chip-icon">notifications_paused</mat-icon>
    @if (appearance() !== 'trailing' || isQuiet()) {
      <span class="quiet-chip-label">{{ label() }}</span>
    }
  </button>
}
