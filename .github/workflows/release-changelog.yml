name: Cut Changelog Release

on:
  release:
    types: [published]

jobs:
  cut-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update CHANGELOG.md for release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DATE=$(date +%Y-%m-%d)

          # Replace [Unreleased] with the version and add new [Unreleased]
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md

          # Update comparison links. The new version's [x.y.z]: link is not added until the sed
          # below, so the first existing version link-def is the immediately-preceding release.
          PREV_VERSION=$(grep -oP '^\[[\d.]+\]' CHANGELOG.md | head -1 | tr -d '[]')
          if [ -n "$PREV_VERSION" ]; then
            sed -i "s|\[Unreleased\]: .*|[Unreleased]: https://github.com/${{ github.repository }}/compare/v$VERSION...HEAD\n[$VERSION]: https://github.com/${{ github.repository }}/compare/v$PREV_VERSION...v$VERSION|" CHANGELOG.md
          fi

      # Collect dependency bumps into the freshly-cut version section.
      #
      # Dependabot PRs are exempt from the per-PR changelog check (see changelog.yml) so they can
      # be batched here instead. The alternative — a bot committing an entry onto each Dependabot
      # branch — makes concurrent Dependabot PRs conflict on the same lines of CHANGELOG.md, and
      # Dependabot stops rebasing any PR another actor has modified.
      - name: Add Dependencies section for merged deps PRs
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          # Range: previous tag (exclusive) through this release's tag. `git describe` walks back
          # from the tag's parent to the preceding tag; with no preceding tag (first release) the
          # range degrades to the whole history, which is what we want.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then END="$TAG"; else END="HEAD"; fi
          PREV_TAG="$(git describe --tags --abbrev=0 "$END^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$END"; else RANGE="$END"; fi
          echo "Collecting dependency commits over $RANGE"

          # Squash merges land as `deps: bump the angular group ... (#338)`. Only `deps:` is
          # collected: that prefix is configured for the nuget and npm ecosystems in
          # dependabot.yml. `ci:` (Actions) and `build:` (Docker base images) are deliberately
          # excluded — they are not runtime dependencies of the shipped product.
          entries="$(git log --no-merges --pretty=%s "$RANGE" \
            | grep -E '^deps(\(.*\))?!?: ' \
            | sed -E 's/^deps(\(.*\))?!?: //' \
            | sed -E "s|\(#([0-9]+)\)\$|([#\1](https://github.com/$REPO/pull/\1))|" \
            | sed -E 's/^(.)/\U\1/' \
            | sort -u \
            | sed 's/^/- /' || true)"

          if [ -z "$entries" ]; then
            echo "No dependency commits in range — no Dependencies section to add."
            exit 0
          fi

          echo "Adding:"
          printf '%s\n' "$entries"

          # Append the section at the end of the new version's block, i.e. immediately before the
          # next `## [version]` heading or the link-definition footer, whichever comes first.
          block="### Dependencies"$'\n'"$entries"$'\n'
          # index() rather than a regex: the version is interpolated, and `[2.12.0]` in a regex
          # is a character class, not a literal — that silently never matches the heading.
          awk -v ver="$VERSION" -v block="$block" '
            !done && index($0, "## [" ver "]") == 1 { inver = 1; prev = $0; print; next }
            inver && (/^## \[/ || /^\[[^]]+\]: /) {
              if (prev != "") print ""
              print block
              inver = 0; done = 1
            }
            { prev = $0; print }
            END {
              if (inver) {
                if (prev != "") print ""
                print block
              }
            }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      # Flags whether the GitHub App is configured. Secrets can't be read in `if:` conditions
      # directly, so surface it as a step output the later steps can gate on.
      - name: Detect app config
        id: cfg
        env:
          APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG_APP_ID/CHANGELOG_APP_PRIVATE_KEY not set — opening the changelog PR with GITHUB_TOKEN, which does not trigger the required CI checks. The PR will need a manual (admin) merge. See the workflow header for setup."
          fi

      # An App installation token makes the PR author the app bot, so push/PR events trigger the
      # required status checks (Backend/Frontend/Changelog). GITHUB_TOKEN-authored PRs do NOT
      # trigger workflows (GitHub's recursion guard), which leaves required checks permanently
      # pending and the PR blocked. App tokens are short-lived and auto-minted per run — no PAT
      # rotation. Requires a GitHub App (Contents: write, Pull requests: write) installed on this
      # repo, with its App ID and a private key stored as the secrets below.
      - name: Generate GitHub App token
        id: app-token
        if: steps.cfg.outputs.has_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      - name: Open PR with changelog update
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # App token when configured; otherwise GITHUB_TOKEN (PR opens but needs a manual merge).
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "docs: cut changelog for ${{ github.event.release.tag_name }}"
          title: "docs: cut changelog for ${{ github.event.release.tag_name }}"
          body: |
            Automated CHANGELOG update for release ${{ github.event.release.tag_name }}.

            Promotes the `[Unreleased]` section to `[${{ github.event.release.tag_name }}]` and opens a fresh `[Unreleased]` section.

            Also appends a `### Dependencies` section listing every `deps:` PR merged since the previous tag.

            Triggered by release [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}).
          branch: changelog/${{ github.event.release.tag_name }}
          base: main
          labels: docs,automated
          delete-branch: true

      # Approve from the github-actions[bot] identity. The PR was authored by the app bot, so this
      # is a distinct identity and satisfies the "1 approval" branch-protection rule.
      - name: Approve the changelog PR
        if: steps.cfg.outputs.has_app == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr review "$PR" --approve \
            --body "Automated changelog cut — approving the mechanical [Unreleased] → version promotion. Source entries were already reviewed on their own PRs."

      # Squash-merge once the required checks pass (they run because the PR is app-authored).
      - name: Enable auto-merge
        if: steps.cfg.outputs.has_app == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --auto --delete-branch
