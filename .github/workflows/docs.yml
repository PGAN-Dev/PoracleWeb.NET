name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  # Rebuild when a release is published so the mkdocs-material version badge
  # (fetched at build time from the GitHub Releases API) stays current even
  # when a release touches only code/CHANGELOG and not docs/.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # A prerelease is an experimental build from another branch. Without this, it would
    # redeploy the docs site from that branch's docs.
    # A hyphenated tag (vX.Y.Z-name.N) is skipped too, in case the pre-release box was left unticked.
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !contains(github.event.release.tag_name, '-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "mkdocs>=1.6,<2" mkdocs-material mkdocs-mermaid2-plugin

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
