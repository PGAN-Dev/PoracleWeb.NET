name: Build and Push Experimental Docker Image

# The experimental line (personal shiny alerts) is published as its own package, separate from the
# official ghcr.io/pgan-dev/poracleweb.net image. This workflow exists only on the experimental/shiny
# branch; docker-publish.yml does not pass RELEASE_CHANNEL, so official images keep reporting "official".
#
# - Every push to experimental/shiny publishes edge-<sha>.
# - Publishing a GitHub prerelease whose tag contains "-shiny." (for example v2.20.0-shiny.1) publishes
#   that version, "shiny" and the commit sha.
# - There is deliberately no "latest" tag: nobody should land on this line by pulling the default.

on:
  release:
    types: [published]
  push:
    branches: [experimental/shiny]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pgan-dev/poracleweb.net-experimental

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event.release.prerelease && contains(github.event.release.tag_name, '-shiny.'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never "latest": without an explicit latest tag, and with flavor latest=false, the action
          # adds none of its own.
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=edge-,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=shiny,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=,enable=${{ github.event_name == 'release' }}

      # Computed here rather than pulled out of the metadata-action JSON, so the value passed
      # to the build is plainly visible in the log next to the one baked into the labels.
      - name: Build timestamp
        id: build
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mirrors the OCI labels above into the running container, where GET /api/version can
          # read them. RELEASE_CHANNEL is what makes the SPA show the Experimental chip.
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            RELEASE_CHANNEL=experimental
          cache-from: type=gha
          cache-to: type=gha,mode=max
