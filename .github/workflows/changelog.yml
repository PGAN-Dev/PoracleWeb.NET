name: Changelog Check

# Verify-only: confirms a PR adds an entry under "## [Unreleased]" in CHANGELOG.md.
# It never writes to the repo, so it cannot trip branch protection on `main`.
# Replaces the old post-merge auto-writer, which always failed pushing to protected main
# and risked duplicate entries. Release cuts are still handled by release-changelog.yml.

# `merge_group` is listed so this required check reports against the merge queue's temporary
# branch; without it, every queued PR stalls waiting for a check that never runs.
#
# The check itself is a pull-request-level policy and is deliberately a no-op in the queue.
# A `merge_group` payload has no `pull_request` object at all, so TITLE, LABELS, BASE_SHA and
# HEAD_SHA would all be empty: the exempt-prefix test would miss, `git show ""` would fail,
# and the job would report a bogus failure on a PR that already passed this gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry present
    runs-on: ubuntu-latest
    steps:
      # Unconditional, so the job always has at least one successful step. A job whose every
      # step is skipped by an `if:` is recorded as a failure, which would block the queue --
      # the same trap documented in auto-merge-deps.yml.
      - name: Context
        run: echo "event=${{ github.event_name }}"

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Already validated on the pull request
        if: github.event_name == 'merge_group'
        run: echo "Merge queue run — the CHANGELOG gate was enforced when this PR was reviewed."

      - name: Require a CHANGELOG entry under [Unreleased]
        if: github.event_name == 'pull_request'
        env:
          # Passed via env (not inlined) to avoid shell injection from PR titles/labels.
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 1) Exempt non-user-facing PR types (mirrors the previous skip set).
          #
          # `deps:` is exempt here but is NOT undocumented: release-changelog.yml batches every
          # merged `deps:` PR since the previous tag into a "### Dependencies" section when it
          # cuts the release. Requiring a per-PR entry instead would mean a bot committing to
          # each Dependabot branch, which makes concurrent Dependabot PRs conflict on CHANGELOG.md
          # and makes Dependabot stop rebasing them (it abandons PRs modified by others).
          if printf '%s' "$TITLE" | grep -qiE '^(deps|docs|style|chore|ci|test|build)(\(.*\))?[!]?:'; then
            echo "Exempt PR type — skipping changelog check."
            echo "  title: $TITLE"
            exit 0
          fi

          # 2) Manual escape hatch for legitimate exceptions.
          if printf ',%s,' "$LABELS" | grep -q ',skip-changelog,'; then
            echo "skip-changelog label present — skipping changelog check."
            exit 0
          fi

          # 3) Extract the [Unreleased] block from both sides of the PR.
          unreleased() {
            git show "$1:CHANGELOG.md" 2>/dev/null \
              | awk '/^## \[Unreleased\]/{f=1; next} f && /^## \[/{f=0} f'
          }
          base_block="$(unreleased "$BASE_SHA" || true)"
          head_block="$(unreleased "$HEAD_SHA" || true)"

          # 4) Top-level entries this PR newly adds under [Unreleased].
          new_entries="$(comm -13 \
            <(printf '%s\n' "$base_block" | grep -E '^- ' | sort -u) \
            <(printf '%s\n' "$head_block" | grep -E '^- ' | sort -u) || true)"

          if [ -n "$new_entries" ]; then
            echo "Found new [Unreleased] entry/entries:"
            printf '%s\n' "$new_entries"
            exit 0
          fi

          echo "::error::This PR has no new entry under '## [Unreleased]' in CHANGELOG.md."
          echo "Add a Keep a Changelog entry (e.g. under '### Fixed'), or:"
          echo "  - use a 'deps|docs|style|chore|ci|test|build:' PR title for non-user-facing changes, or"
          echo "  - apply the 'skip-changelog' label for a legitimate exception."
          exit 1
